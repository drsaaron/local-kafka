version: '2'
services:
  zookeeper:
    image: docker.io/ubuntu/zookeeper:edge
    ports:
      - "2181:2181"
  kafka:
    image: docker.io/ubuntu/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_CREATE_TOPICS: "test:1:1"
      ZOOKEEPER_HOST: zookeeper
      ZOOKEEPER_PORT: 2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      # - /var/run/docker.sock:/var/run/docker.sock # Removed for Podman compatibility
      - ${PWD}/demo.sh:/demo/demo.sh
      - ${PWD}/server.properties:/etc/kafka/server.properties
networks:
  default:
    name: qotd
    external: true
